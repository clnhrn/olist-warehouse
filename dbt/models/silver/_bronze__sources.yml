version: 2

sources:
  - name: bronze
    description: >
      Raw Olist tables as loaded by the ingestion job: every source column as
      STRING, append-only by batch, partitioned by _load_date. Locally,
      register_local_bronze exposes the Parquet in data/bronze/ as DuckDB views.
    schema: "{{ 'bronze' if target.name == 'prod' else 'dev_bronze' }}"
    config:
      loaded_at_field: _loaded_at
      # The dataset is a one-time snapshot, so freshness can only warn.
      freshness:
        warn_after: {count: 30, period: day}
    tables:
      - name: customers
        description: One row per order's customer, per batch. customer_unique_id identifies the person.
      - name: geolocation
        description: Zip code prefix coordinates, per batch. Has no key; duplicate rows are expected.
      - name: order_items
        description: One row per item within an order, per batch.
      - name: order_payments
        description: One row per payment record, per batch.
      - name: order_reviews
        description: One row per review per order, per batch. review_id alone is not unique.
      - name: orders
        description: One row per order with its lifecycle timestamps, per batch.
      - name: product_category_translation
        description: Portuguese to English product category names, per batch.
      - name: products
        description: >
          One row per product, per batch. Batches under contract v1 fill the
          "lenght" typo columns, batches under v2 the corrected ones.
      - name: sellers
        description: One row per seller, per batch. seller_updated_at is filled from contract v2.
