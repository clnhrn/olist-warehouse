# Checks for every pull request. Authenticates as sa-ci-pr: read-only on the
# project, write access to the dev_* datasets only. Nothing here touches prod.
name: pr

on:
  pull_request:
    branches: [main]
    # Same filter as deploy.yml: no .md file affects the build. A PR that
    # also changes other files still runs every check. If checks ever become
    # required (branch protection), replace this with an in-workflow path
    # filter, or skipped docs-only PRs can never merge.
    paths-ignore:
      - "docs/**"
      - "**.md"

# id-token (the OIDC token for Workload Identity Federation) is granted only
# to the jobs that authenticate to GCP, not to lint, test, or image builds.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.2"
  # Referenced here so every job masks it: GitHub masks only the secrets a
  # job uses, and the auth action exports the project id from the SA email.
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # The dbt templater compiles against the DuckDB target: no credentials
      # and no data needed.
      - name: sqlfluff lint
        working-directory: dbt
        run: |
          uv run dbt deps
          uv run sqlfluff lint models
        env:
          OLIST_DUCKDB_PATH: ${{ runner.temp }}/lint.duckdb
      - run: terraform fmt -check -recursive terraform

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      # Contract (Pandera) and ingestion tests. Tests that need the Olist CSVs
      # skip themselves.
      - run: uv run pytest

  terraform-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      DEVELOPER_EMAIL: ${{ secrets.DEVELOPER_EMAIL }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/mask-project-number
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CI_PR_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: ./.github/actions/terraform-init
      - run: terraform -chdir=terraform validate
      # -lock=false: sa-ci-pr can only read the state bucket. The plan stays
      # in the (masked) log; no PR comment, which would not be masked.
      - run: terraform -chdir=terraform plan -lock=false -input=false

  dbt-dev:
    runs-on: ubuntu-latest
    # One build of the dev datasets at a time, across all PRs.
    concurrency:
      group: dev-bigquery
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      OLIST_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/mask-project-number
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CI_PR_SA }}
      - run: uv sync --locked
      - name: dbt build --target dev
        working-directory: dbt
        run: |
          uv run dbt deps
          uv run dbt build --target dev

  # Guardrail check: a pull request must not get a token for sa-ci-deploy,
  # which is bound to refs/heads/main only. access_token forces the exchange
  # (without it, auth only writes a credentials file and cannot fail here).
  deploy-sa-denied:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/mask-project-number
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        continue-on-error: true
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CI_DEPLOY_SA }}
          token_format: access_token
      - name: Expect the deploy account to be refused
        run: test "${{ steps.auth.outcome }}" = failure

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [ingestion, dbt, agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only, to catch a broken Dockerfile before it reaches main.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        # No build record artifact; see deploy.yml.
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
