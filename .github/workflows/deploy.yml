# Deploy on merge to main: Terraform apply, build and push both images, point
# the Cloud Run jobs at them, then run the dbt job on prod. Authenticates as
# sa-ci-deploy, which only refs/heads/main can use. Merging the PR is the
# approval for the apply.
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # OIDC token for Workload Identity Federation

# Deploys queue up and never cancel each other mid-apply.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGION: us-central1
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    env:
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      DEVELOPER_EMAIL: ${{ secrets.DEVELOPER_EMAIL }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/mask-project-number
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CI_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: ./.github/actions/terraform-init
      - run: terraform -chdir=terraform plan -input=false -out=deploy.tfplan
      - run: terraform -chdir=terraform apply -input=false deploy.tfplan

  images:
    needs: terraform-apply
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [ingestion, dbt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/mask-project-number
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CI_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # One plain linux/amd64 manifest (no index, no attestations), so each
      # push is one registry version for the keep-2 cleanup policy.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/olist/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-jobs:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/mask-project-number
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CI_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      # update changes only the image; Terraform owns every other setting.
      - name: Point the jobs at the new images
        run: |
          for job in ingestion dbt; do
            gcloud run jobs update "$job" --region="$REGION" \
              --image="$REGION-docker.pkg.dev/$GCP_PROJECT_ID/olist/$job:$GITHUB_SHA"
          done

  prod-dbt:
    needs: deploy-jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/mask-project-number
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CI_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      # Runs as sa-dbt-prod, like the scheduled pipeline, so prod writes and
      # the ops.pipeline_runs audit rows come from the job, not from CI.
      - run: gcloud run jobs execute dbt --region="$REGION" --wait
