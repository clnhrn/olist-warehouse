# Shared by pr.yml (plan) and deploy.yml (apply). Expects the job to be
# authenticated to GCP and to set GCP_PROJECT_ID, TF_STATE_BUCKET,
# DEVELOPER_EMAIL, and ALERT_EMAIL (may be empty) in its env.
name: terraform init
description: Install Terraform, export its variables, and init the GCS backend.

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.16.5
        terraform_wrapper: false

    # The jobs' images are owned by CI and ignored by Terraform, but the
    # variables gate the jobs' creation, so pass the images they run now.
    - name: Export Terraform variables
      shell: bash
      run: |
        image() {
          gcloud run jobs describe "$1" --region=us-central1 \
            --format='value(spec.template.spec.template.spec.containers[0].image)'
        }
        {
          echo "TF_VAR_project_id=$GCP_PROJECT_ID"
          echo "TF_VAR_developer_email=$DEVELOPER_EMAIL"
          echo "TF_VAR_ingestion_image=$(image ingestion)"
          echo "TF_VAR_dbt_image=$(image dbt)"
          if [ -n "$ALERT_EMAIL" ]; then echo "TF_VAR_alert_email=$ALERT_EMAIL"; fi
        } >> "$GITHUB_ENV"

    - name: terraform init
      shell: bash
      run: |
        terraform -chdir=terraform init -input=false \
          -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="prefix=main"
