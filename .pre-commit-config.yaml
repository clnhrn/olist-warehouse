# Install once: uv run pre-commit install
# Lint hooks run through uv, so they use the versions pinned in uv.lock.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # dbt YAML is valid; --unsafe only checks syntax
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: sqlfluff
        name: sqlfluff lint
        # Lints the whole project: the dbt templater compiles it once anyway.
        entry: bash -c 'cd dbt && uv run sqlfluff lint models'
        language: system
        files: ^dbt/(models|macros)/.*\.sql$
        pass_filenames: false
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check -recursive terraform
        language: system
        files: ^terraform/.*\.tf$
        pass_filenames: false
