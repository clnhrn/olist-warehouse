[project]
name = "olist-warehouse"
version = "0.1.0"
description = "Olist warehouse: ingestion job, data contracts, and text-to-SQL agent."
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-cloud-bigquery>=3.30",
    "google-cloud-storage>=3.0",
    "pandera[polars]>=0.24",
    "polars>=1.20",
    "pyyaml>=6.0",
]

[dependency-groups]
# agent: the text-to-SQL agent and its Chainlit UI (agent image: --no-dev --group agent).
agent = [
    "anthropic>=1.13.0",
    "chainlit>=2.12.0",
    "google-cloud-secret-manager>=2.31.0",
    "plotly>=7.1.0",
    "sqlglot>=30.21.0",
]
dbt = [
    "dbt-bigquery>=1.12.1",
    "dbt-core>=1.12.5",
]
# dbt: what the dbt job image installs (--only-group dbt), BigQuery only.
# dev: local tools, plus dbt-duckdb for local runs and the dbt group, so
# `uv sync` installs everything and the ingestion image (--no-dev) none of it.
dev = [
    "dbt-duckdb>=1.11.0",
    "pre-commit>=4.6.2",
    "pytest>=8.3",
    "ruff>=0.9",
    "sqlfluff>=4.4.0",
    "sqlfluff-templater-dbt>=4.4.0",
    {include-group = "dbt"},
    {include-group = "agent"},
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "contracts", "agent"]
exclude = ["ingestion/Dockerfile"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# T20: no print statements, use logging. D: docstrings (Google style).
select = ["E", "F", "I", "UP", "B", "SIM", "T20", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names say what they check; docstrings stay optional there.
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# dbt-bigquery pulls google-cloud-aiplatform (~150 MB) for dbt Python models
# only, and imports it lazily. This project has no Python models, so a
# marker that never matches drops it and keeps the dbt image small.
override-dependencies = ["google-cloud-aiplatform; sys_platform == 'never'"]
