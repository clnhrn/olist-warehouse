[project]
name = "olist-warehouse"
version = "0.1.0"
description = "Olist warehouse: ingestion job and data contracts."
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-cloud-bigquery>=3.30",
    "google-cloud-storage>=3.0",
    "pandera[polars]>=0.24",
    "polars>=1.20",
    "pyyaml>=6.0",
]

[dependency-groups]
dbt = [
    "dbt-bigquery>=1.12.1",
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
]
# dbt has its own group so its job image can install it alone (Phase 3).
# dev includes it, so `uv sync` installs it locally and `--no-dev` leaves it out.
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    {include-group = "dbt"},
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "contracts"]
exclude = ["ingestion/Dockerfile"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# T20: no print statements, use logging.
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
